[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr-constrained-molgen"
version = "0.1.0"
description = "Small EGFR SMILES generator with an explicit chemistry rejection funnel"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
